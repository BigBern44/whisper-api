<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SubSync — Sous-titrage automatique</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080808;
      --surface:   #111111;
      --border:    #1e1e1e;
      --border-hi: #2e2e2e;
      --text:      #f0ede8;
      --muted:     #555;
      --accent:    #d4ff5f;
      --accent-dim:#a8cc48;
      --red:       #ff4d4d;
      --radius:    12px;
      --font:      'Syne', sans-serif;
      --mono:      'DM Mono', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Grain overlay ────────────────────────────────────── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: .025;
      pointer-events: none;
      z-index: 9999;
    }

    /* ── Layout ───────────────────────────────────────────── */
    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ── Header ───────────────────────────────────────────── */
    header {
      padding: 36px 0 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .logo-dot {
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: .4; transform: scale(.7); }
    }

    .badge {
      font-family: var(--mono);
      font-size: .65rem;
      font-weight: 300;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 99px;
      letter-spacing: .04em;
    }

    /* ── Main ─────────────────────────────────────────────── */
    main {
      padding: 56px 0 40px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .headline {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 2.9rem);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -.03em;
    }

    h1 em {
      font-style: normal;
      color: var(--accent);
    }

    .sub {
      font-family: var(--mono);
      font-size: .8rem;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: .02em;
    }

    /* ── Drop zone ────────────────────────────────────────── */
    .drop-zone {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 52px 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      position: relative;
      overflow: hidden;
    }

    .drop-zone::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(212,255,95,.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .drop-zone:hover,
    .drop-zone.over {
      border-color: var(--border-hi);
      background: #161616;
    }

    .drop-zone.over {
      border-color: var(--accent);
      background: rgba(212,255,95,.04);
    }

    .drop-zone input[type=file] {
      position: absolute; inset: 0;
      opacity: 0; cursor: pointer;
    }

    .drop-icon {
      width: 44px; height: 44px;
      margin: 0 auto 18px;
      border: 1px solid var(--border-hi);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .2s, transform .2s;
    }

    .drop-zone:hover .drop-icon,
    .drop-zone.over .drop-icon {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .drop-icon svg { stroke: var(--text); transition: stroke .2s; }
    .drop-zone:hover .drop-icon svg,
    .drop-zone.over .drop-icon svg { stroke: var(--accent); }

    .drop-title {
      font-size: .95rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .drop-hint {
      font-family: var(--mono);
      font-size: .72rem;
      color: var(--muted);
      letter-spacing: .03em;
    }

    /* ── File preview ─────────────────────────────────────── */
    .file-preview {
      display: none;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      animation: fadeUp .3s ease;
    }

    .file-preview.visible { display: flex; }

    .file-thumb {
      width: 48px; height: 36px;
      border-radius: 6px;
      background: #1a1a1a;
      border: 1px solid var(--border-hi);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .file-info { flex: 1; overflow: hidden; }
    .file-name {
      font-size: .85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-size {
      font-family: var(--mono);
      font-size: .68rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .file-remove {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      border-radius: 4px;
      transition: color .15s;
      line-height: 0;
    }
    .file-remove:hover { color: var(--red); }

    /* ── Options ─────────────────────────────────────────── */
    .options-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .select-wrap {
      position: relative;
      flex: 1;
      min-width: 160px;
    }

    select {
      width: 100%;
      appearance: none;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font);
      font-size: .85rem;
      padding: 11px 36px 11px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color .2s;
      outline: none;
    }

    select:focus { border-color: var(--border-hi); }

    .select-arrow {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--muted);
    }

    /* ── Submit button ────────────────────────────────────── */
    .btn-submit {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #0a0a0a;
      border: none;
      font-family: var(--font);
      font-size: .88rem;
      font-weight: 700;
      padding: 11px 22px;
      border-radius: var(--radius);
      cursor: pointer;
      letter-spacing: .01em;
      transition: background .15s, transform .15s, opacity .15s;
      white-space: nowrap;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--accent-dim);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    /* ── Progress card ────────────────────────────────────── */
    .progress-card {
      display: none;
      flex-direction: column;
      gap: 18px;
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      animation: fadeUp .35s ease;
    }

    .progress-card.visible { display: flex; }

    .progress-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .progress-label {
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .progress-status {
      font-family: var(--mono);
      font-size: .72rem;
      color: var(--accent);
      letter-spacing: .05em;
    }

    .progress-bar-track {
      height: 3px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      width: 0%;
      transition: width .6s ease;
    }

    .progress-bar-fill.indeterminate {
      width: 100%;
      animation: indeterminate 1.6s ease-in-out infinite;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    @keyframes indeterminate {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .progress-log {
      font-family: var(--mono);
      font-size: .72rem;
      color: var(--muted);
      line-height: 1.8;
    }

    .log-line { animation: fadeUp .2s ease; }
    .log-line.accent { color: var(--accent); }
    .log-line.error  { color: var(--red); }

    /* ── Download card ────────────────────────────────────── */
    .download-card {
      display: none;
      flex-direction: column;
      gap: 16px;
      padding: 24px;
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      background: rgba(212,255,95,.04);
      animation: fadeUp .4s ease;
    }

    .download-card.visible { display: flex; }

    .download-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .check-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      animation: pop .4s cubic-bezier(.34,1.56,.64,1);
    }

    @keyframes pop {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    .download-title { font-size: 1rem; font-weight: 700; }
    .download-sub   {
      font-family: var(--mono);
      font-size: .72rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .btn-download {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: var(--accent);
      color: #0a0a0a;
      border: none;
      font-family: var(--font);
      font-size: .9rem;
      font-weight: 700;
      padding: 13px;
      border-radius: var(--radius);
      cursor: pointer;
      text-decoration: none;
      transition: background .15s, transform .15s;
      letter-spacing: .01em;
    }

    .btn-download:hover {
      background: var(--accent-dim);
      transform: translateY(-1px);
    }

    .btn-reset {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font);
      font-size: .8rem;
      padding: 9px;
      border-radius: var(--radius);
      cursor: pointer;
      text-align: center;
      letter-spacing: .02em;
      transition: border-color .15s, color .15s;
    }

    .btn-reset:hover { border-color: var(--border-hi); color: var(--text); }

    /* ── Error banner ─────────────────────────────────────── */
    .error-banner {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border: 1px solid var(--red);
      border-radius: var(--radius);
      background: rgba(255,77,77,.06);
      font-family: var(--mono);
      font-size: .75rem;
      color: var(--red);
      animation: fadeUp .3s ease;
    }

    .error-banner.visible { display: flex; }

    /* ── Footer ───────────────────────────────────────────── */
    footer {
      padding: 24px 0 32px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-left {
      font-family: var(--mono);
      font-size: .68rem;
      color: var(--muted);
      letter-spacing: .04em;
    }

    .footer-right {
      font-family: var(--mono);
      font-size: .68rem;
      color: var(--muted);
    }

    /* ── Animations ───────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .shell > * { animation: fadeUp .5s ease both; }
    header      { animation-delay: 0s; }
    main        { animation-delay: .08s; }
    footer      { animation-delay: .16s; }
  </style>
</head>
<body>
<div class="shell">

  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-dot"></div>
      SubSync
    </div>
    <span class="badge">v2.0 · Whisper</span>
  </header>

  <!-- Main -->
  <main>
    <div class="headline">
      <h1>Sous-titrage<br/><em>automatique</em></h1>
      <p class="sub">// déposez une vidéo · obtenez-la sous-titrée</p>
    </div>

    <!-- Drop zone -->
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".mp4,.mov,.mkv,.webm,.avi" />
      <div class="drop-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <p class="drop-title">Glissez votre vidéo ici</p>
      <p class="drop-hint">mp4 · mov · mkv · webm · avi</p>
    </div>

    <!-- File preview -->
    <div class="file-preview" id="filePreview">
      <div class="file-thumb">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <path d="M8 21h8M12 17v4"/>
        </svg>
      </div>
      <div class="file-info">
        <div class="file-name" id="fileName">—</div>
        <div class="file-size" id="fileSize">—</div>
      </div>
      <button class="file-remove" id="fileRemove" title="Retirer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Options + submit -->
    <div class="options-row" id="optionsRow">
      <div class="select-wrap">
        <select id="langSelect">
          <option value="">Détection automatique</option>
          <option value="fr">Français</option>
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="de">Deutsch</option>
          <option value="it">Italiano</option>
          <option value="pt">Português</option>
          <option value="ja">日本語</option>
          <option value="zh">中文</option>
          <option value="ar">العربية</option>
        </select>
        <svg class="select-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <button class="btn-submit" id="btnSubmit" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        Sous-titrer
      </button>
    </div>

    <!-- Error -->
    <div class="error-banner" id="errorBanner">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="errorMsg">Une erreur est survenue.</span>
    </div>

    <!-- Progress -->
    <div class="progress-card" id="progressCard">
      <div class="progress-header">
        <span class="progress-label">Traitement</span>
        <span class="progress-status" id="progressStatus">UPLOAD…</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill indeterminate" id="progressBar"></div>
      </div>
      <div class="progress-log" id="progressLog"></div>
    </div>

    <!-- Download -->
    <div class="download-card" id="downloadCard">
      <div class="download-top">
        <div class="check-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <div>
          <div class="download-title">Vidéo prête !</div>
          <div class="download-sub" id="downloadSub">sous-titres intégrés</div>
        </div>
      </div>
      <a class="btn-download" id="btnDownload" href="#" download>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Télécharger la vidéo
      </a>
      <button class="btn-reset" id="btnReset">Traiter une autre vidéo</button>
    </div>

  </main>

  <!-- Footer -->
  <footer>
    <span class="footer-left">SubSync · Whisper / Triton</span>
    <span class="footer-right">© 2025</span>
  </footer>

</div>

<script>
  const API = 'http://localhost:8000';

  const dropZone       = document.getElementById('dropZone');
  const fileInput      = document.getElementById('fileInput');
  const filePreview    = document.getElementById('filePreview');
  const fileName       = document.getElementById('fileName');
  const fileSize       = document.getElementById('fileSize');
  const fileRemove     = document.getElementById('fileRemove');
  const langSelect     = document.getElementById('langSelect');
  const btnSubmit      = document.getElementById('btnSubmit');
  const progressCard   = document.getElementById('progressCard');
  const progressStatus = document.getElementById('progressStatus');
  const progressBar    = document.getElementById('progressBar');
  const progressLog    = document.getElementById('progressLog');
  const downloadCard   = document.getElementById('downloadCard');
  const downloadSub    = document.getElementById('downloadSub');
  const btnDownload    = document.getElementById('btnDownload');
  const btnReset       = document.getElementById('btnReset');
  const errorBanner    = document.getElementById('errorBanner');
  const errorMsg       = document.getElementById('errorMsg');

  let selectedFile = null;
  let eventSource  = null;

  // ── Drag & drop ──────────────────────────────────────────
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('over');
    const f = e.dataTransfer.files[0];
    if (f) setFile(f);
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) setFile(fileInput.files[0]);
  });

  fileRemove.addEventListener('click', resetFile);

  function setFile(f) {
    selectedFile = f;
    fileName.textContent = f.name;
    fileSize.textContent = formatBytes(f.size);
    filePreview.classList.add('visible');
    dropZone.style.display = 'none';
    btnSubmit.disabled = false;
    hideError();
  }

  function resetFile() {
    selectedFile = null;
    fileInput.value = '';
    filePreview.classList.remove('visible');
    dropZone.style.display = '';
    btnSubmit.disabled = true;
  }

  function formatBytes(b) {
    return b < 1024 * 1024
      ? (b / 1024).toFixed(1) + ' KB'
      : (b / (1024 * 1024)).toFixed(1) + ' MB';
  }

  // ── Submit ───────────────────────────────────────────────
  btnSubmit.addEventListener('click', async () => {
    if (!selectedFile) return;
    hideError();
    startProgress('UPLOAD…');

    // 1. Upload de la vidéo
    const form = new FormData();
    form.append('file', selectedFile);
    const lang    = langSelect.value;
    const postUrl = lang ? `${API}/subtitles?language=${lang}` : `${API}/subtitles`;

    let jobId;
    try {
      log('Envoi de la vidéo…');
      const res = await fetch(postUrl, { method: 'POST', body: form });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      jobId = data.job_id;
      log(`Job créé <span class="accent">${jobId.slice(0, 8)}…</span>`);
    } catch (err) {
      showError('Échec de l\'envoi : ' + err.message);
      stopProgress();
      return;
    }

    // 2. Ouverture du SSE — connexion unique, pas de polling
    log('En attente du traitement…');
    setStatus('TRAITEMENT…');

    eventSource = new EventSource(`${API}/subtitles/${jobId}/stream`);

    // Confirmation de connexion au serveur
    eventSource.addEventListener('connected', () => {
      log('Flux connecté, traitement en cours…');
    });

    // Webhook reçu → traitement terminé
    eventSource.addEventListener('done', e => {
      eventSource.close();
      eventSource = null;
      log('<span class="accent">✓ Sous-titres intégrés</span>');
      stopProgress(true);
      showDownload(e.data, selectedFile.name);
    });

    // Erreur remontée par le webhook
    eventSource.addEventListener('error', e => {
      eventSource.close();
      eventSource = null;
      const msg = e.data || 'Erreur inconnue';
      log(`<span class="log-error">✗ ${msg}</span>`);
      showError(msg);
      stopProgress();
    });

    // Coupure réseau / timeout
    eventSource.onerror = () => {
      if (eventSource && eventSource.readyState === EventSource.CLOSED) {
        showError('La connexion au serveur a été interrompue.');
        stopProgress();
        eventSource = null;
      }
    };
  });

  // ── Progress helpers ─────────────────────────────────────
  function startProgress(label = 'TRAITEMENT…') {
    progressCard.classList.add('visible');
    progressLog.innerHTML = '';
    progressBar.classList.add('indeterminate');
    setStatus(label);
    btnSubmit.disabled = true;
    downloadCard.classList.remove('visible');
    hideError();
  }

  function stopProgress(success = false) {
    progressBar.classList.remove('indeterminate');
    progressBar.style.width = success ? '100%' : '0%';
    setStatus(success ? 'TERMINÉ' : 'ARRÊTÉ');
    if (!success) btnSubmit.disabled = !selectedFile;
  }

  function setStatus(label) {
    progressStatus.textContent = label;
  }

  function log(html) {
    const line = document.createElement('div');
    line.className = 'log-line';
    line.innerHTML = `<span style="color:var(--border-hi)">›</span> ${html}`;
    progressLog.appendChild(line);
    progressLog.scrollTop = progressLog.scrollHeight;
  }

  // ── Download ─────────────────────────────────────────────
  function showDownload(url, originalName) {
    const ext  = originalName.slice(originalName.lastIndexOf('.'));
    const name = originalName.replace(ext, `_subtitled${ext}`);
    btnDownload.href        = url;
    btnDownload.download    = name;
    downloadSub.textContent = name;
    downloadCard.classList.add('visible');
    progressCard.classList.remove('visible');
  }

  // ── Reset ─────────────────────────────────────────────────
  btnReset.addEventListener('click', () => {
    if (eventSource) { eventSource.close(); eventSource = null; }
    resetFile();
    downloadCard.classList.remove('visible');
    progressCard.classList.remove('visible');
    progressLog.innerHTML = '';
    progressBar.style.width = '0%';
    hideError();
  });

  // ── Error ─────────────────────────────────────────────────
  function showError(msg) {
    errorMsg.textContent = msg;
    errorBanner.classList.add('visible');
  }

  function hideError() {
    errorBanner.classList.remove('visible');
  }
</script>
</body>
</html>
